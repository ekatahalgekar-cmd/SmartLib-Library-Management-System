
<!DOCTYPE html>
<html>
<head>
    <title>Librarian Profile - SmartLib</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: #F5F3FF;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            max-width: 600px;
            margin: 55px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(76,29,149,0.12);
            text-align: center;
            border: 1px solid #EDE9FE;
        }

        .profile-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #EDE9FE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            border: 4px solid #DDD6FE;
        }

        .profile-card h2 {
            color: #4C1D95;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .profile-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .profile-info {
            text-align: left;
            margin-top: 25px;
        }

        .info-item {
            background: #F5F3FF;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 14px;
            border-left: 4px solid #8B5CF6;
        }

        .info-item strong {
            color: #6D28D9;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .info-item span {
            color: #241442;
            font-size: 16px;
            font-weight: 600;
        }

        .profile-input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #DDD6FE;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .profile-input:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 5px rgba(139,92,246,0.3);
        }

        .profile-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin: 8px 4px;
            text-decoration: none;
            display: inline-block;
        }

        .edit-btn, .update-btn {
            background: #6D28D9;
            color: white;
        }

        .edit-btn:hover, .update-btn:hover {
            background: #4C1D95;
            transform: translateY(-2px);
        }

        .cancel-btn, .back-btn {
            background: #EDE9FE;
            color: #4C1D95;
        }

        .cancel-btn:hover, .back-btn:hover {
            background: #DDD6FE;
            transform: translateY(-2px);
        }

        .profile-message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            transition: opacity 0.5s ease;
        }

        .profile-message.success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
        }

        .profile-message.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .button-group {
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 650px) {
            .profile-card {
                margin: 25px 15px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="profile-card">

    <div class="profile-icon">👤</div>

    <h2>Librarian Profile</h2>

    <p class="profile-subtitle">
        SmartLib Library Management System
    </p>

    <!-- Success / Error Message -->

    {% if message %}
    <div class="profile-message {{ message_type }}" id="profile-message">
        {{ message }}
    </div>
    {% endif %}

    <!-- Profile Information -->

    <div class="profile-info" id="profile-info">

        <div class="info-item">
            <strong>Full Name</strong>
            <span>{{ librarian_name }}</span>
        </div>

        <div class="info-item">
            <strong>Username</strong>
            <span>{{ librarian_username }}</span>
        </div>

        <div class="info-item">
            <strong>Role</strong>
            <span>Library Administrator</span>
        </div>

        <div class="info-item">
            <strong>System</strong>
            <span>SmartLib</span>
        </div>

    </div>

    <!-- Edit Profile Form -->

    <form method="POST"
          id="edit-profile-form"
          style="display:none;">

        <div class="profile-info">

            <div class="info-item">
                <strong>Full Name</strong>

                <input type="text"
                       name="full_name"
                       class="profile-input"
                       value="{{ librarian_name }}"
                       required>
            </div>

            <div class="info-item">
                <strong>Username</strong>

                <input type="text"
                       name="username"
                       class="profile-input"
                       value="{{ librarian_username }}"
                       required>
            </div>

            <div class="info-item">
                <strong>Role</strong>
                <span>Library Administrator</span>
            </div>

            <div class="info-item">
                <strong>System</strong>
                <span>SmartLib</span>
            </div>

        </div>

        <div class="button-group">

            <button type="submit"
                    class="profile-btn update-btn">
                💾 Update Profile
            </button>

            <button type="button"
                    class="profile-btn cancel-btn"
                    onclick="cancelEdit()">
                Cancel
            </button>

        </div>

    </form>

    <!-- Edit Button -->

    <button type="button"
            class="profile-btn edit-btn"
            id="edit-button"
            onclick="editProfile()">
        ✏️ Edit Profile
    </button>

    <br>

    <!-- Dashboard Button -->

    <a href="{{ url_for('home') }}" class="profile-btn back-btn">
        ← Back to Dashboard
    </a>

</div>

<script>

function editProfile() {

    document.getElementById("profile-info").style.display = "none";

    document.getElementById("edit-profile-form").style.display = "block";

    document.getElementById("edit-button").style.display = "none";
}

function cancelEdit() {

    document.getElementById("edit-profile-form").reset();

    document.getElementById("edit-profile-form").style.display = "none";

    document.getElementById("profile-info").style.display = "block";

    document.getElementById("edit-button").style.display = "inline-block";
}

// Automatically hide success and error messages

document.addEventListener("DOMContentLoaded", function() {

    const message = document.getElementById("profile-message");

    if (message) {

        setTimeout(function() {

            message.style.opacity = "0";

            setTimeout(function() {
                message.remove();
            }, 500);

        }, 3000);
    }

});

</script>

</body>
</html>
