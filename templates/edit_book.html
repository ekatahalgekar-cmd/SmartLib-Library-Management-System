
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book | SmartLib</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #c8afe3;
            color: #241442;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(91, 33, 182, 0.12);
        }

        h1 {
            margin-top: 0;
            color: #6D28D9;
            text-align: center;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #D8C9F5;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #7c3aed;
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7C3AED;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6D28D9;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #6D28D9;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Edit Book</h1>
        <p>Update the details of your library book.</p>

        <form method="POST">
            <label for="title">Book Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ book.title }}"
                required
            >

            <label for="author">Author Name</label>
            <input
                type="text"
                id="author"
                name="author"
                value="{{ book.author }}"
                required
            >

            <label for="category">Book Category</label>
            <input
                type="text"
                id="category"
                name="category"
                value="{{ book.category }}"
                required
            >

            <label for="quantity">Total Copies</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                value="{{ book.quantity }}"
                required
            >

            <button type="submit">Save Changes</button>
        </form>

        <a class="back-link" href="{{ url_for('book_catalog') }}">
            ← Back to Book Catalog
        </a>
    </div>
</body>
</html>
