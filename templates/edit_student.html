<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLib | Edit Student</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #c8afe3;
            color: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #243b6b;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #d5dbea;
            border-radius: 7px;
        }

        button {
            background: #6254d9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #512365;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>✏️ Edit Student Details</h2>

        <form method="POST">

            <label>Student Name</label>
            <input type="text" name="name"
                   value="{{ student[1] }}" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   value="{{ student[2] }}" required>

            <label>Phone Number</label>
            <input type="text" name="phone"
                   value="{{ student[3] }}" required>

            <button type="submit">Update Student</button>

            <a href="{{ url_for('students') }}" class="back">
                Cancel
            </a>

        </form>

    </div>
</div>

</body>
</html>
