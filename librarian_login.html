<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLib | Librarian Login</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #c8afe3, #f4f6fb);
        color: #1e293b;
        padding: 20px;
    }

    .login-card {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(36, 59, 107, 0.12);
    }

    .logo {
        text-align: center;
        font-size: 42px;
        margin-bottom: 10px;
    }

    h1 {
        text-align: center;
        color: #243b6b;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 28px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 20px;
        border: 1px solid #d5dbea;
        border-radius: 8px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #6254d9;
    }

    button {
        width: 100%;
        padding: 13px;
        background: #6254d9;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #4e42bd;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #243b6b;
        text-decoration: none;
    }

    .note {
        text-align: center;
        color: #64748b;
        font-size: 12px;
        margin-top: 18px;
    }
</style>

</head><body>
    <div class="login-card">    <div class="logo">🔐</div>

    <h1>Librarian Login</h1>
    <p class="subtitle">Welcome to SmartLib Administration</p>
    {% if message %}
<p id="login-message" style="
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    background: #FEE2E2;
    color: #991B1B;
    border: 1px solid #FCA5A5;
    margin-bottom: 20px;
    font-weight: 600;
">
    {{ message }}
</p>
{% endif %}

    <form method="POST" action="{{ url_for('librarian_login') }}">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter librarian username"
            required
            autocomplete="off"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            autocomplete="new-password"
        >

        <button type="submit">Login</button>
    </form>

   
    <p class="note">SmartLib Library Management System</p>

</div>
<script>
    document.addEventListener("DOMContentLoaded",function() {
        const message = document.getElementById("login-message");
        if(message) {
            setTimeout(function(){
                message.style.transition = "opacity 0.5s ease";
                message.style.opacity ="0";

                setTimeout(function(){
                    message.remove();
                },500);
            },4000);
        }
    });
</script>

</body>
</html>
